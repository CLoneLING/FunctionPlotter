# Cloudflare Workers 静态站点配置
# 供「Workers & Pages → Create → 连接 Git」流程使用：部署命令 `npx wrangler deploy`
# 站点文件在 docs/，这里把 docs/ 直接作为静态资源上传。
# worker/index.js 只做一件事：挡住图片被直接下载（防盗链）。

name = "functionplotter"
compatibility_date = "2025-10-01"
main = "./worker/index.js"

[assets]
directory = "./docs"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/assets/*"]